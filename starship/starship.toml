# Starship configuration — migrated from powerlevel10k lean style
# Requires a NerdFont (same requirement as p10k)

# Add a blank line before each prompt (matches POWERLEVEL9K_PROMPT_ADD_NEWLINE)
add_newline = true

# Two-line prompt with box-drawing frame (matches p10k lean full-frame style)
# Line 1: ╭─ os  dir  git ──────── status  duration  jobs  env  time ─╮
# Line 2: ╰─ ❯
# Note: right_format renders on the input line (line 2), so all right-side
# content must live in format after $fill to appear on line 1.
format = """
\n╭─$os$directory$git_branch$git_status$fill$status$cmd_duration$jobs$python$nodejs$ruby$golang$java$php$terraform$kubernetes$aws$azure$gcloud$nix_shell$memory_usage$battery$time─╮
╰─$character"""

[fill]
symbol = "─"
style = "244"

[os]
format = "[$symbol]($style) "
style = "bold white"
disabled = false

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold fg:39"
read_only = " "
read_only_style = "fg:196"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
# Anchor directories that contain these files (matches p10k anchor_files)
before_repo_root_style = "fg:103"
repo_root_style = "bold fg:39"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "fg:148"
truncation_length = 40

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "fg:178"
conflicted = "~$count"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
untracked = "?$count"
stashed = "*$count"
modified = "!$count"
staged = "+$count"
renamed = "»$count"
deleted = "✘$count"

[status]
format = "[$symbol$status]($style) "
symbol = "✘ "
success_symbol = ""
not_executable_symbol = " "
not_found_symbol = " "
sigint_symbol = "󰗖 "
signal_symbol = "⚡"
style = "fg:196"
disabled = false

[cmd_duration]
format = "[ $duration]($style) "
style = "fg:yellow"
min_time = 3_000
show_milliseconds = false

[jobs]
format = "[$symbol$number]($style) "
symbol = "⚙ "
style = "fg:blue"
number_threshold = 1
symbol_threshold = 0

# ── Language / environment version managers ──────────────────────────────────

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
style = "fg:yellow"
pyenv_version_name = true

[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "
style = "fg:green"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[ruby]
format = "[$symbol($version )]($style)"
symbol = " "
style = "fg:red"

[golang]
format = "[$symbol($version )]($style)"
symbol = " "
style = "fg:cyan"

[java]
format = "[$symbol($version )]($style)"
symbol = " "
style = "fg:red"

[php]
format = "[$symbol($version )]($style)"
symbol = " "
style = "fg:purple"

[lua]
format = "[$symbol($version )]($style)"
symbol = " "
style = "fg:blue"

[haskell]
format = "[$symbol($version )]($style)"
symbol = " "
style = "fg:purple"

# ── Cloud & infrastructure ────────────────────────────────────────────────────

[kubernetes]
format = "[$symbol$context( \\($namespace\\))]($style) "
symbol = "󱃾 "
style = "fg:cyan"
disabled = false

[terraform]
format = "[$symbol$workspace]($style) "
symbol = "󱁢 "
style = "fg:purple"

[aws]
format = "[$symbol($profile )(\\[$duration\\] )]($style)"
symbol = " "
style = "fg:yellow"

[azure]
format = "[$symbol($subscription)]($style) "
symbol = "󰠅 "
style = "fg:blue"
disabled = false

[gcloud]
format = "[$symbol$account(@$domain)(\\($region\\))]($style) "
symbol = " "
style = "fg:blue"

[nix_shell]
format = "[$symbol$state( \\($name\\))]($style) "
symbol = " "
style = "fg:blue"

# ── System info ───────────────────────────────────────────────────────────────

[memory_usage]
format = "[$symbol${ram}( | ${swap})]($style) "
symbol = " "
style = "fg:244"
threshold = 75
disabled = false

[battery]
format = "[$symbol$percentage]($style) "
disabled = false

[[battery.display]]
threshold = 15
style = "bold fg:red"

[[battery.display]]
threshold = 30
style = "fg:yellow"

[time]
format = "[$time]($style) "
time_format = "%H:%M"
style = "fg:244"
disabled = false

# ── Prompt character ──────────────────────────────────────────────────────────

[character]
# Matches p10k: green ❯ on success, red ❯ on failure; ❮ for vi command mode
success_symbol = "[❯](bold fg:76)"
error_symbol = "[❯](bold fg:196)"
vimcmd_symbol = "[❮](bold fg:76)"
vimcmd_replace_one_symbol = "[▶](bold fg:76)"
vimcmd_replace_symbol = "[▶](bold fg:76)"
vimcmd_visual_symbol = "[V](bold fg:76)"
